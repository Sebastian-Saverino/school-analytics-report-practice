[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "project_1_dashboard"
version = "0.0.1"
description = "This is going to be a project focused on working through the data workflow and to refresh myself on data engineering and data science"
authors = [
  { name = "Sebastian Saverino" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "fastparquet>=2026.9.0",
    "fg-data-profiling[notebook]>=4.20.0",
    "ipykernel>=7.4.0",
    "ipython",
    "ipywidgets>=8.1.9",
    "jupyterlab",
    "kagglehub>=1.0.2",
    "loguru",
    "matplotlib",
    "missingno>=0.5.2",
    "notebook",
    "numpy",
    "pandas",
    "pandoc>=2.4",
    "pip",
    "pyarrow>=26.0.0",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["project_1_dashboard"]
include = ["pyproject.toml", "project_1_dashboard/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["project_1_dashboard"]
force-sort-within-sections = true

